<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login + Item System</title>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
    padding: 20px;
}

/* Login Box */
#loginBox {
    max-width: 300px;
    margin: auto;
    background: white;
    padding: 20px;
    border: 2px solid black;
}

input, button {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    margin-top: 10px;
}

th, td {
    border: 2px solid black;
    padding: 10px;
}

th {
    background: #ddd;
}

.deleteBtn {
    background: red;
    color: white;
    border: none;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<!-- 🔐 Login -->
<div id="loginBox">
    <h3>Login</h3>
    <input type="text" id="noyonahmedrehan" placeholder="Username">
    <input type="password" id="noyon890" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="error" style="color:red;"></p>
</div>

<!-- 📦 Main App -->
<div id="app" class="hidden">

<h2>📦 Item List</h2>

<button onclick="logout()">Logout</button>

<br><br>

<input type="text" id="itemName" placeholder="Item Name">
<input type="text" id="qty" placeholder="Quantity">
<input type="date" id="date">
<button onclick="addItem()">Add</button>

<br>

<input type="text" id="search" placeholder="Search..." onkeyup="searchItem()">

<h3>Total Items: <span id="total">0</span></h3>

<table id="table"></table>

</div>

<script>

// 🔐 Login Info (change here)
const USER = "admin";
const PASS = "1234";

// Check login on load
if(localStorage.getItem("loggedIn") === "true") {
    showApp();
}

function login() {
    let u = document.getElementById("username").value;
    let p = document.getElementById("password").value;

    if(u === USER && p === PASS) {
        localStorage.setItem("loggedIn", "true");
        showApp();
    } else {
        document.getElementById("error").innerText = "Wrong username or password!";
    }
}

function logout() {
    localStorage.removeItem("loggedIn");
    location.reload();
}

function showApp() {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("app").classList.remove("hidden");
}

// 📦 DATA SYSTEM
let data = JSON.parse(localStorage.getItem("items")) || [];

function saveData() {
    localStorage.setItem("items", JSON.stringify(data));
}

function render() {
    let table = document.getElementById("table");

    table.innerHTML = `
    <tr>
        <th>Item</th>
        <th>Quantity</th>
        <th>Date</th>
        <th>Action</th>
    </tr>`;

    data.forEach((item, index) => {
        table.innerHTML += `
        <tr>
            <td contenteditable oninput="editItem(${index}, 'name', this.innerText)">${item.name}</td>
            <td contenteditable oninput="editItem(${index}, 'qty', this.innerText)">${item.qty}</td>
            <td>${item.date}</td>
            <td><button class="deleteBtn" onclick="deleteItem(${index})">Delete</button></td>
        </tr>`;
    });

    document.getElementById("total").innerText = data.length;
}

function addItem() {
    let name = itemName.value;
    let qty = qty.value;
    let date = date.value;

    if(!name || !qty || !date) return alert("Fill all fields!");

    data.push({name, qty, date});
    saveData();
    render();

    itemName.value = "";
    qty.value = "";
    date.value = "";
}

function deleteItem(index) {
    data.splice(index, 1);
    saveData();
    render();
}

function editItem(index, field, value) {
    data[index][field] = value;
    saveData();
}

function searchItem() {
    let value = document.getElementById("search").value.toLowerCase();
    let rows = document.querySelectorAll("#table tr");

    rows.forEach((row, i) => {
        if(i === 0) return;
        let text = row.innerText.toLowerCase();
        row.style.display = text.includes(value) ? "" : "none";
    });
}

render();

</script>

</body>
</html>

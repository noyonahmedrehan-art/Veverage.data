<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Item System</title>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
    padding: 20px;
}

#loginBox {
    max-width: 300px;
    margin: auto;
    background: white;
    padding: 20px;
    border: 2px solid black;
}

input, button {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    margin-top: 10px;
}

th, td {
    border: 2px solid black;
    padding: 10px;
}

th {
    background: #ddd;
}

.deleteBtn {
    background: red;
    color: white;
    border: none;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<!-- Login -->
<div id="loginBox">
    <h3>Login</h3>
    <input type="text" id="username">
    <input type="password" id="password">
    <button onclick="login()">Login</button>
    <p id="error" style="color:red;"></p>
</div>

<!-- App -->
<div id="app" class="hidden">

<h2>📦 Item List</h2>

<button onclick="logout()">Logout</button>

<br><br>

<input type="text" id="itemName" placeholder="Item Name">
<input type="text" id="qty" placeholder="Quantity">
<input type="date" id="date">
<button onclick="addItem()">Add</button>

<br>

<input type="text" id="search" placeholder="Search..." onkeyup="searchItem()">

<!-- 📊 REPORT FILTER -->
<h3>📊 View Report by Date</h3>
<input type="date" id="filterDate">
<button onclick="filterByDate()">Show Report</button>
<button onclick="render()">Show All</button>

<h3>Total Items: <span id="total">0</span></h3>

<table id="table"></table>

</div>

<script>

// Login
const USER = "admin";
const PASS = "1234";

if(localStorage.getItem("loggedIn") === "true") showApp();

function login() {
    let u = username.value;
    let p = password.value;

    if(u === USER && p === PASS) {
        localStorage.setItem("loggedIn", "true");
        showApp();
    } else {
        error.innerText = "Wrong login!";
    }
}

function logout() {
    localStorage.removeItem("loggedIn");
    location.reload();
}

function showApp() {
    loginBox.style.display = "none";
    app.classList.remove("hidden");
}

// Data
let data = JSON.parse(localStorage.getItem("items")) || [];

function saveData() {
    localStorage.setItem("items", JSON.stringify(data));
}

function render(filteredData = data) {
    let table = document.getElementById("table");

    table.innerHTML = `
    <tr>
        <th>Item</th>
        <th>Quantity</th>
        <th>Date</th>
        <th>Action</th>
    </tr>`;

    filteredData.forEach((item, index) => {
        table.innerHTML += `
        <tr>
            <td contenteditable oninput="editItem(${index}, 'name', this.innerText)">${item.name}</td>
            <td contenteditable oninput="editItem(${index}, 'qty', this.innerText)">${item.qty}</td>
            <td>${item.date}</td>
            <td><button class="deleteBtn" onclick="deleteItem(${index})">Delete</button></td>
        </tr>`;
    });

    document.getElementById("total").innerText = filteredData.length;
}

// Add
function addItem() {
    let name = itemName.value;
    let quantity = qty.value;
    let dateValue = date.value;

    if(!name || !quantity || !dateValue) {
        alert("Fill all fields!");
        return;
    }

    data.push({name, qty: quantity, date: dateValue});
    saveData();
    render();

    itemName.value = "";
    qty.value = "";
    date.value = "";
}

// Delete
function deleteItem(index) {
    data.splice(index, 1);
    saveData();
    render();
}

// Edit
function editItem(index, field, value) {
    data[index][field] = value;
    saveData();
}

// Search
function searchItem() {
    let value = search.value.toLowerCase();
    let rows = document.querySelectorAll("#table tr");

    rows.forEach((row, i) => {
        if(i === 0) return;
        let text = row.innerText.toLowerCase();
        row.style.display = text.includes(value) ? "" : "none";
    });
}

// 📊 Filter by Date
function filterByDate() {
    let selectedDate = document.getElementById("filterDate").value;

    if(!selectedDate) {
        alert("Select a date!");
        return;
    }

    let filtered = data.filter(item => item.date === selectedDate);
    render(filtered);
}

// Load
render();

</script>

</body>
</html>
